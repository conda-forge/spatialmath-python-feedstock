schema_version: 1

context:
  name: spatialmath-python
  version: "1.1.18"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: dfd265b93f5152c02eb8c05bfc8d5f820e76caa715acbdf7bb8f2d60a6ab22ec

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - ansitable
    - colored >=2.0.0,<3
    - matplotlib-base
    - numpy
    - python >=${{ python_min }}
    - scipy
    - sympy
    - sphinxcontrib-jsmath
    - typing-extensions
    - pre_commit

tests:
  - python:
      imports:
        - spatialmath
        - spatialmath.base
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Provides spatial maths capability for Python.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/bdaiinstitute/spatialmath-python

extra:
  recipe-maintainers:
    - Tobias-Fischer
    - petercorke
